<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">

        <div class="profile-card">

            <!-- Badge -->
            <span class="profile-badge">Available</span>

            <!-- Profile Image -->
            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
                alt="Profile picture of Rahul Sharma"
                class="profile-image"
            >

            <!-- Name and Role -->
            <h1 class="profile-name">Jacob Tau</h1>
            <h2 class="profile-role">Frontend Developer</h2>

            <!-- Description -->
            <p class="profile-description">
                I am a passionate frontend developer who enjoys creating
                beautiful, responsive, and user-friendly websites using
                modern web technologies.
            </p>

            <!-- Skills -->
            <div class="skills-section">
                <h3>My Skills</h3>

                <ul class="skills-list">
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                    <li>Responsive Design</li>
                </ul>
            </div>

            <!-- Contact Button -->
            <a href="mailto:rahul@example.com" class="contact-button">
                Contact Me
            </a>

        </div>

    </main>

</body>
</html>
